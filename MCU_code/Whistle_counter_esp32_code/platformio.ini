; Open this folder directly in VS Code after installing the PlatformIO IDE extension.
; PlatformIO will download the ESP32 Arduino framework and the LCD library on first build.

[platformio]
; Keep the existing Arduino sketch at the project root.
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

lib_deps =
  marcoschwartz/LiquidCrystal_I2C@^1.1.4

monitor_speed = 115200
